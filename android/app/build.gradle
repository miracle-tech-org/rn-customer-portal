apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Production upload signing (Play Store).
// Create android/keystore.properties from keystore.properties.example
// and place customer-portal-upload.keystore in android/app/.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.velonav.customerportal"
    defaultConfig {
        applicationId "com.velonav.customerportal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['MYAPP_UPLOAD_KEY_ALIAS']
                keyPassword keystoreProperties['MYAPP_UPLOAD_KEY_PASSWORD']
                storeFile file(keystoreProperties['MYAPP_UPLOAD_STORE_FILE'])
                storePassword keystoreProperties['MYAPP_UPLOAD_STORE_PASSWORD']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Use upload keystore when android/keystore.properties exists;
            // otherwise fall back to debug signing (local/internal only).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Google Services plugin (required for Firebase / FCM).
// File must live at: android/app/google-services.json
// and include client package_name matching applicationId: com.velonav.customerportal
def googleServicesFile = file("${projectDir}/google-services.json")
if (googleServicesFile.exists()) {
    def gsContent = googleServicesFile.getText("UTF-8")
    if (!gsContent.contains("\"package_name\": \"com.velonav.customerportal\"")) {
        throw new GradleException(
            "[push] android/app/google-services.json is missing package_name com.velonav.customerportal. " +
            "Download the Android config for this exact package from Firebase Console."
        )
    }
    apply plugin: "com.google.gms.google-services"
    logger.lifecycle("[push] Applied Google Services plugin using ${googleServicesFile}")
} else {
    logger.warn(
        "[push] Missing ${googleServicesFile} — Firebase Messaging disabled for this build. " +
        "Place google-services.json next to android/app/build.gradle then rebuild."
    )
}
